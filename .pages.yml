# Configuração do Pages CMS (docs/slice-5.md). Mantido à mão; os campos seguem os schemas em src/lib/schemas.ts
# e tests/pages-cms.test.ts reprova se divergirem. Sem e-mail, telefone ou segredos aqui.
content:
  - name: journal-pt
    label: Journal (PT)
    type: collection
    path: src/content/journal/pt
    format: yaml-frontmatter
    fields:
      - name: date
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: lang
        label: Idioma
        type: select
        required: true
        default: pt
        options:
          values:
            - pt
      - name: title
        label: Título
        type: string
        required: true
      - name: did
        label: O que fiz
        type: text
        required: true
      - name: learned
        label: O que aprendi
        type: text
        required: true
      - name: tags
        label: Temas (tags, em inglês)
        type: string
        list: true
        required: true
      - &a1
        name: draft
        label: Rascunho (fica fora do site)
        type: boolean
        default: false
      - name: links
        label: Links
        type: string
        pattern:
          regex: ^https?://
          message: Use uma URL completa, começando com http:// ou https://
        list: true
      - &a2
        name: translation_of
        label: Original (nome do arquivo, sem .md)
        type: string
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      sort:
        - date
      order: desc
  - name: journal-en
    label: Journal (EN)
    type: collection
    path: src/content/journal/en
    format: yaml-frontmatter
    fields:
      - name: date
