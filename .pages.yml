  - name: themes-pt
    label: Temas (PT)
    type: collection
    path: src/content/themes/pt
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Slug (minúsculas e hífens)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: "kebab-case: letras minúsculas, números e hífens"
      - name: lang
        label: Idioma
        type: select
        required: true
        default: pt
        options:
          values:
            - pt
      - name: title
        label: Título
        type: string
        required: true
      - name: summary
        label: Resumo
        type: text
    exclude:
      - .gitkeep
  - name: themes-en
    label: Temas (EN)
