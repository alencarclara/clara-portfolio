        required: true
      - name: learned
        label: O que aprendi
        type: text
        required: true
      - name: tags
        label: Temas (tags, em inglês)
        type: string
        list: true
        required: true
      - *a1
      - name: links
        label: Links
        type: string
        pattern:
          regex: ^https?://
          message: Use uma URL completa, começando com http:// ou https://
        list: true
      - *a2
    filename: "{year}-{month}-{day}-{title}.md"
    view:
